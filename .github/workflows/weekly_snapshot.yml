name: Weekly Pipeline Snapshot

on:
  schedule:
    # Every Thursday at 18:00 UTC (6pm GMT / 7pm BST)
    - cron: "0 18 * * 4"
  workflow_dispatch: # allow manual trigger from GitHub Actions UI

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install msal requests pandas numpy openpyxl PyMuPDF python-dotenv

      - name: Save pipeline snapshot
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SHAREPOINT_FILE_URL: ${{ secrets.SHAREPOINT_FILE_URL }}
          BUDGET_FILE_URL: ${{ secrets.BUDGET_FILE_URL }}
          SCOPE_FILE_URL: ${{ secrets.SCOPE_FILE_URL }}
          GITHUB_TOKEN: ${{ secrets.SNAPSHOT_GITHUB_TOKEN }}
        run: python save_snapshot.py
